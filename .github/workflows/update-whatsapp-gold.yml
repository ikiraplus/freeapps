name: Update WhatsApp Gold install

on:
  push:
    paths:
      - '.github/workflows/update-whatsapp-gold.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update WhatsApp Gold install link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'aXRtcy1zZXJ2aWNlczovLz9hY3Rpb249ZG93bmxvYWQtbWFuaWZlc3QmdXJsPWh0dHBzOi8vYm90LmlwYXNpZ24uY2MvZGwvMjAyNjA5MjgxNDM4MjU0MDAwMTA4L0hTT0JBd3JsUTkyMy5wbGlzdA=='
          new = 'aXRtcy1zZXJ2aWNlczovLz9hY3Rpb249ZG93bmxvYWQtbWFuaWZlc3QmdXJsPWh0dHBzOi8vZ2l0aHViLmNvbS9hY2hhbDM4OTU5LWRvdC9pcGEtaG9zdC9yZWxlYXNlcy9kb3dubG9hZC92MzUvN2FmYmRmZDItNjM5Ni00ZmRjLWFlNmYtNWVkMzg5ODk0MzIzLnBsaXN0'
          if old not in s:
              raise SystemExit('Old WhatsApp Gold link not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Update WhatsApp Gold install manifest'
          git push
