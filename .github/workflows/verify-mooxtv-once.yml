name: Verify MooxTV bundle once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-mooxtv-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Download MooxTV IPA and update bundle id
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/ikiraplus/freeapps/releases/assets/658278734 \
            -o /tmp/mooxtv.ipa

          python3 <<'PY'
          import plistlib
          import zipfile
          from pathlib import Path, PurePosixPath

          ipa = Path('/tmp/mooxtv.ipa')
          manifest = Path('manifest-mooxtv.plist')

          with zipfile.ZipFile(ipa, 'r') as z:
              candidates = []
              for name in z.namelist():
                  p = PurePosixPath(name)
                  if len(p.parts) == 3 and p.parts[0] == 'Payload' and p.parts[1].endswith('.app') and p.parts[2] == 'Info.plist':
                      candidates.append(name)
              if len(candidates) != 1:
                  raise SystemExit(f'Expected one main Info.plist, found {len(candidates)}')
              info = plistlib.loads(z.read(candidates[0]))
              bundle = str(info.get('CFBundleIdentifier') or '').strip()
              if not bundle or '.' not in bundle:
                  raise SystemExit(f'Invalid bundle id: {bundle!r}')

          with manifest.open('rb') as f:
              data = plistlib.load(f)
          item = data['items'][0]
          package = next(a for a in item['assets'] if a.get('kind') == 'software-package')
          metadata = item['metadata']
          package['url'] = 'https://dl.ikiraplus.workers.dev/freeapps/658278734/MooxTv.-.Signed.ipa'
          metadata['bundle-identifier'] = bundle
          metadata['title'] = 'MooxTV'
          with manifest.open('wb') as f:
              plistlib.dump(data, f, sort_keys=False)
          print('MooxTV bundle:', bundle)
          PY

          rm -f .github/workflows/verify-mooxtv-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify MooxTV bundle id'
          git pull --rebase origin main
          git push
