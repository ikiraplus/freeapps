# one-time trigger via merge
name: Restore old TikTok install link

on:
  push:
    paths:
      - '.github/workflows/restore-tiktok-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore TikTok items-service link
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'aXRtcy1zZXJ2aWNlczovLz9hY3Rpb249ZG93bmxvYWQtbWFuaWZlc3QmdXJsPWh0dHBzOi8vZ2l0aHViLmNvbS9sYWxpdDkzNzgyOTkvaXBhLWhvc3QvcmVsZWFzZXMvZG93bmxvYWQvdjM0L2U2NjBmMmE5LTQwMGYtNDJlYy1iZDY4LTFiYTdkYzIyYmNmNi5wbGlzdA=='
          new = 'aXRtcy1zZXJ2aWNlczovLz9hY3Rpb249ZG93bmxvYWQtbWFuaWZlc3QmdXJsPWh0dHBzOi8vaWtpcmFwbHVzLnBhZ2VzLmRldi9tYW5pZmVzdC10aWt0b2twbHVzLnBsaXN0'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 current TikTok link, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore old TikTok install link"
          git push
