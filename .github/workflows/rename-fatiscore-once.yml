name: Rename VoziPlay to FatiScore once

on:
  push:
    paths:
      - '.github/workflows/rename-fatiscore-once.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Apply FatiScore replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          old_plist = Path('manifest-voziplay.plist')
          new_plist = Path('manifest-fatiscore.plist')

          if old_plist.exists():
              text = old_plist.read_text(encoding='utf-8')
          elif new_plist.exists():
              text = new_plist.read_text(encoding='utf-8')
          else:
              raise SystemExit('Vozi/FatiScore manifest not found')

          text = text.replace(
              'https://dl.ikiraplus.workers.dev/freeapps/656793656/Vozi.Play.ipa',
              'https://dl.ikiraplus.workers.dev/freeapps/658278268/fatiScore.-.Signed.ipa'
          )
          text = text.replace('<string>voziplay</string>', '<string>FatiScore</string>')
          new_plist.write_text(text, encoding='utf-8')
          if old_plist.exists() and old_plist != new_plist:
              old_plist.unlink()

          map_path = Path('release-map.json')
          mapping = json.loads(map_path.read_text(encoding='utf-8'))
          new_mapping = {}
          for key, value in mapping.items():
              if key == 'manifest-voziplay.plist':
                  new_mapping['manifest-fatiscore.plist'] = {'keywords': ['fatiscore']}
              else:
                  new_mapping[key] = value
          map_path.write_text(json.dumps(new_mapping, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('alt="voziplay"', 'alt="FatiScore"')
          index = index.replace('<div class="app-name">voziplay</div>', '<div class="app-name">FatiScore</div>')
          index = index.replace(
              'aXRtcy1zZXJ2aWNlczovLz9hY3Rpb249ZG93bmxvYWQtbWFuaWZlc3QmdXJsPWh0dHBzOi8vaWtpcmFwbHVzLnBhZ2VzLmRldi9tYW5pZmVzdC12b3ppcGxheS5wbGlzdA==',
              'aXRtcy1zZXJ2aWNlczovLz9hY3Rpb249ZG93bmxvYWQtbWFuaWZlc3QmdXJsPWh0dHBzOi8vaWtpcmFwbHVzLnBhZ2VzLmRldi9tYW5pZmVzdC1mYXRpc2NvcmUucGxpc3Q='
          )
          index_path.write_text(index, encoding='utf-8')

          Path('.github/workflows/rename-fatiscore-once.yml').unlink(missing_ok=True)
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Replace VoziPlay with FatiScore'
          git pull --rebase origin main
          git push origin main
