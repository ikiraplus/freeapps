name: Clean EN description line formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-existing-en-lines.yml'

permissions:
  contents: write

concurrency:
  group: sync-ipa-ar-en
  cancel-in-progress: true

jobs:
  cleanup-en:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Remove accidental word-level line breaks only
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          path = Path('IPA-EN.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          def collapse_ws(text):
              return re.sub(r'\s+', ' ', str(text or '')).strip()

          changed = 0
          for app in data.get('apps', []):
              if not isinstance(app, dict):
                  continue
              old = str(app.get('localizedDescription') or '')
              if not old:
                  continue

              # A prior formatter could split lowercase words such as
              # "the\nusername" or "and\npassword". Join only those
              # accidental lowercase word breaks; keep real list/section lines.
              new = re.sub(r'\n(?=(?:username|password)\b)', ' ', old)

              if collapse_ws(new) != collapse_ws(old):
                  raise SystemExit(f'Unexpected wording change: {app.get("name") or app.get("id")}')
              if new != old:
                  app['localizedDescription'] = new
                  changed += 1

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Cleaned descriptions: {changed}')
          print('No translation performed; only accidental whitespace breaks were joined.')

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- IPA-EN.json; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPA-EN.json
          git commit -m 'Clean EN description line formatting'
          git pull --rebase origin main
          git push
