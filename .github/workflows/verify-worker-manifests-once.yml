name: Verify Worker-backed manifests once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-worker-manifests-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify every non-empty manifest Worker URL
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > worker-urls.txt
          import glob, plistlib
          for path in sorted(glob.glob('manifest-*.plist')):
              with open(path, 'rb') as f:
                  data = plistlib.load(f)
              items = data.get('items') or []
              if not items:
                  continue
              assets = items[0].get('assets') or []
              pkg = next((a for a in assets if a.get('kind') == 'software-package'), None)
              url = str((pkg or {}).get('url') or '').strip()
              if url:
                  if not url.startswith('https://dl.ikiraplus.workers.dev/freeapps/'):
                      raise SystemExit(f'{path}: unexpected package URL: {url}')
                  print(path + '\t' + url)
              else:
                  print(path + '\tEMPTY', file=__import__('sys').stderr)
          PY

          count=0
          while IFS=$'\t' read -r plist url; do
            [ -n "$url" ] || continue
            count=$((count+1))
            echo "Checking $plist -> $url"

            head_code=$(curl -sS -I --max-time 30 -D head.txt -o /dev/null -w '%{http_code}' "$url")
            [ "$head_code" = "200" ] || { cat head.txt; echo "$plist HEAD failed: $head_code"; exit 1; }
            grep -Eiq '^accept-ranges:[[:space:]]*bytes[[:space:]]*$' head.txt

            range_code=$(curl -sS --max-time 30 -H 'Range: bytes=0-3' -D range.txt -o first4.bin -w '%{http_code}' "$url")
            [ "$range_code" = "206" ] || { cat range.txt; echo "$plist Range failed: $range_code"; exit 1; }
            [ "$(wc -c < first4.bin)" -eq 4 ]
            python3 - <<'PY'
          data = open('first4.bin', 'rb').read()
          if data[:2] != b'PK':
              raise SystemExit(f'Expected IPA ZIP signature PK, got {data!r}')
          PY
          done < worker-urls.txt

          [ "$count" -gt 0 ]
          echo "Verified $count Worker-backed manifest URLs"
