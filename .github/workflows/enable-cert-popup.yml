name: Enable certificate purchase popup

on:
  push:
    paths:
      - '.github/workflows/enable-cert-popup.yml'

permissions:
  contents: write

jobs:
  enable-popup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the original certificate popup only
        shell: bash
        run: |
          set -euo pipefail

          # This historical commit removed only the certificate purchase popup.
          # Reverse its index.html patch against today's file so later app/link updates stay intact.
          git show e3bcfe5f1dcf2e760788807b7aa75efbbe00921c -- index.html > /tmp/remove-certificate-popup.patch
          git apply -R --3way /tmp/remove-certificate-popup.patch

          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          disabled = '<script>var CERT_POPUP_ENABLED = false;</script>'
          enabled = '<script>var CERT_POPUP_ENABLED = true;</script>'

          if disabled in s:
              s = s.replace(disabled, enabled, 1)
          elif enabled not in s:
              raise SystemExit('CERT_POPUP_ENABLED flag was not restored as expected')

          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq '<script>var CERT_POPUP_ENABLED = true;</script>' index.html
          grep -Fq 'id="cert-popup-overlay"' index.html
          grep -Fq 'تنويه هام — الشهادة المجانية غير متاحة' index.html
          grep -Fq 'id="cert-popup-buy-btn"' index.html
          git diff --check

      - name: Commit restored popup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
            exit 0
          fi
          git commit -m 'Enable certificate purchase popup'
          git pull --rebase origin main
          git push origin HEAD:main
