name: Fix EN news image once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-en-news-image-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix permanent English news image override
        shell: python
        run: |
          from pathlib import Path

          p = Path('sync_apps.py')
          s = p.read_text(encoding='utf-8')
          old = '"com.ikiraplus.certpaid": "https://raw.githubusercontent.com/ikiraplus/ipastore/main/images/cert-en.png"'
          new = '"com.ikiraplus.certpaid": "https://ikiraplus-assets.pages.dev/images/cert-en.png"'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find EN certificate news override')

          p.write_text(s, encoding='utf-8')

          # Old private image URLs are allowed only inside the legacy converter table.
          lines = s.splitlines()
          offenders = []
          in_prefix_table = False
          for i, line in enumerate(lines, 1):
              if line.startswith('PRIVATE_IPASTORE_IMAGE_PREFIXES = ('):
                  in_prefix_table = True
              elif in_prefix_table and line.strip() == ')':
                  in_prefix_table = False
                  continue
              if 'raw.githubusercontent.com/ikiraplus/ipastore' in line and not in_prefix_table:
                  offenders.append((i, line.strip()))
          if offenders:
              raise SystemExit('Private raw ipastore image URL remains outside converter table: ' + repr(offenders))

          required = [
              'https://ikiraplus-assets.pages.dev/images/kiraplus.png',
              'https://ikiraplus-assets.pages.dev/images/cert-ar.png',
              'https://ikiraplus-assets.pages.dev/images/cert-en.png',
              'https://ikiraplus-assets.pages.dev/images/ikiraplus.jpg',
              'publicize_ipastore_image_url',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing permanent image config: ' + repr(missing))
          print('Permanent AR/EN image configuration verified')

      - name: Syntax check
        run: python -m py_compile sync_apps.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sync_apps.py
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'Use Pages URL for English news image'
          git pull --rebase origin main
          git push
