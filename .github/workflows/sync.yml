name: Sync IPA-AR + IPA-EN from iKiraPlus source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: sync-ipa-ar-en
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout freeapps
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download latest jom.json
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            'https://raw.githubusercontent.com/ikiraplus/ipastore/main/jom.json' \
            -o source_jom.json

          python - <<'PY'
          import json
          with open('source_jom.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          apps = data.get('apps', [])
          if not isinstance(apps, list) or not apps:
              raise SystemExit('source jom.json has no apps')
          print(f'✅ source apps downloaded: {len(apps)}')
          PY

      - name: Sync IPA-AR.json + IPA-EN.json
        env:
          # No API key needed: translation uses Google's free, unofficial
          # translate_a/single endpoint. Kept intentionally conservative.
          TRANSLATE_WORKERS: '3'
          TRANSLATE_MAX_RPM: '20'
        run: |
          set -euo pipefail
          python sync_apps.py \
            --source source_jom.json \
            --target IPA-AR.json \
            --target-en IPA-EN.json

      - name: Show sync summary
        run: |
          python - <<'PY'
          import json
          for path in ('IPA-AR.json', 'IPA-EN.json'):
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
              apps = [a for a in data.get('apps', []) if isinstance(a, dict)]
              two_versions = sum(1 for a in apps if len(a.get('versions', [])) == 2)
              one_version = sum(1 for a in apps if len(a.get('versions', [])) == 1)
              print(f'✅ apps in {path}: {len(apps)}')
              print(f'✅ {path} apps with 2 versions: {two_versions}')
              print(f'✅ {path} apps with 1 version: {one_version}')
              print(f"✅ first app in {path}: {apps[0].get('name') if apps else 'NONE'}")

          ar = json.load(open('IPA-AR.json', 'r', encoding='utf-8'))
          en = json.load(open('IPA-EN.json', 'r', encoding='utf-8'))
          if len(ar.get('apps', [])) != len(en.get('apps', [])):
              raise SystemExit('❌ IPA-AR.json and IPA-EN.json have different app counts')
          print('✅ AR/EN app counts match')
          PY

      - name: Commit only when AR or EN changed
        shell: bash
        run: |
          set -euo pipefail
          rm -f source_jom.json

          if git diff --quiet -- IPA-AR.json IPA-EN.json; then
            echo '✅ No changes in IPA-AR.json or IPA-EN.json — nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add IPA-AR.json IPA-EN.json
          git commit -m 'Auto sync IPA-AR and IPA-EN source'
          git push
