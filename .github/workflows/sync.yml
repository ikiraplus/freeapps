name: Sync IPA-AR + IPA-EN from iKiraPlus source

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: sync-ipa-ar-en
  cancel-in-progress: true

jobs:
  format-existing-en:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest freeapps
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Arrange existing English descriptions into lines only
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          ar_path = Path('IPA-AR.json')
          en_path = Path('IPA-EN.json')
          ar = json.loads(ar_path.read_text(encoding='utf-8'))
          en = json.loads(en_path.read_text(encoding='utf-8'))

          def key(app):
              app_id = str(app.get('id') or '').strip()
              if app_id:
                  return ('id', app_id)
              bundle = str(app.get('bundleIdentifier') or app.get('bundleId') or '').strip()
              name = str(app.get('name') or '').strip()
              return ('fallback', bundle, name)

          def collapse_ws(text):
              return re.sub(r'\s+', ' ', str(text or '')).strip()

          def reflow(ar_text, en_text):
              ar_text = str(ar_text or '').replace('\r\n', '\n').replace('\r', '\n')
              text = str(en_text or '').replace('\r\n', '\n').replace('\r', '\n').strip()
              if not text or '\n' not in ar_text:
                  return text

              text = re.sub(r'[ \t]*\n[ \t]*', '\n', text)
              text = re.sub(r'[ \t]+(?=-[ \t]+)', '\n', text)
              text = re.sub(r'(?<=:)[ \t]*(?=-[ \t]+)', '\n', text)
              text = re.sub(r'[ \t]+(?=\d+[ \t]*-[ \t]+)', '\n', text)

              heading = r'(?:App features|Game features|Mod features|Activation|Installation|To enable the features)\s*:'
              text = re.sub(r'(?<=[.!?])[ \t]+(?=' + heading + r')', '\n\n', text, flags=re.IGNORECASE)
              text = re.sub(r'[ \t]+(?=(?:Installation|Activation|To enable the features)\s*:)', '\n\n', text, flags=re.IGNORECASE)
              text = re.sub(r'[ \t]+(?=(?:Username|Password)\s*:?)', '\n', text, flags=re.IGNORECASE)

              text = re.sub(r'[ \t]+\n', '\n', text)
              text = re.sub(r'\n[ \t]+', '\n', text)
              text = re.sub(r'\n{3,}', '\n\n', text)
              return text.strip()

          ar_by_key = {key(a): a for a in ar.get('apps', []) if isinstance(a, dict)}
          changed = 0
          inspected = 0

          for app in en.get('apps', []):
              if not isinstance(app, dict):
                  continue
              ar_app = ar_by_key.get(key(app))
              if not ar_app:
                  continue
              ar_desc = str(ar_app.get('localizedDescription') or '')
              old_desc = str(app.get('localizedDescription') or '')
              if '\n' not in ar_desc or not old_desc.strip():
                  continue
              inspected += 1
              new_desc = reflow(ar_desc, old_desc)
              if collapse_ws(new_desc) != collapse_ws(old_desc):
                  raise SystemExit(f'Wording changed unexpectedly: {app.get("name") or app.get("id")}')
              if new_desc != old_desc:
                  app['localizedDescription'] = new_desc
                  changed += 1

          en['translationFormatVersion'] = 5
          en_path.write_text(json.dumps(en, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Inspected Arabic multiline descriptions: {inspected}')
          print(f'Reformatted existing English descriptions: {changed}')
          print('No translation service used. English wording preserved exactly.')

      - name: Validate formatting only
        shell: python
        run: |
          import json
          with open('IPA-EN.json', 'r', encoding='utf-8') as f:
              en = json.load(f)
          if en.get('translationFormatVersion') != 5:
              raise SystemExit('translationFormatVersion is not 5')
          count = sum(1 for a in en.get('apps', []) if isinstance(a, dict) and '\n' in str(a.get('localizedDescription') or ''))
          if count == 0:
              raise SystemExit('No multiline English descriptions found after formatting')
          print(f'Validated multiline descriptions: {count}')

      - name: Commit formatted IPA-EN only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- IPA-EN.json; then
            echo 'No English formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPA-EN.json
          git commit -m 'Format existing EN descriptions into lines'
          git pull --rebase origin main
          git push

  sync-ar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout freeapps
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Preserve previous Arabic source for EN diff
        run: |
          cp IPA-AR.json previous_IPA-AR.json

      - name: Download latest jom.json
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             --retry 5             --retry-delay 2             --retry-all-errors             'https://raw.githubusercontent.com/ikiraplus/ipastore/main/jom.json'             -o source_jom.json

          python - <<'PY'
          import json
          with open('source_jom.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          apps = data.get('apps', [])
          if not isinstance(apps, list) or not apps:
              raise SystemExit('source jom.json has no apps')
          print(f'✅ source apps downloaded: {len(apps)}')
          PY

      - name: Sync Arabic source only
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python -u sync_apps.py             --source source_jom.json             --target IPA-AR.json

      - name: Validate Arabic source
        run: |
          python - <<'PY'
          import json
          with open('IPA-AR.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          apps = [a for a in data.get('apps', []) if isinstance(a, dict)]
          if not apps:
              raise SystemExit('❌ IPA-AR.json has no apps')
          print(f'✅ IPA-AR apps: {len(apps)}')
          print(f"✅ first app: {apps[0].get('name')}")
          PY

      - name: Upload previous Arabic source for EN translation
        uses: actions/upload-artifact@v4
        with:
          name: previous-ipa-ar
          path: previous_IPA-AR.json
          retention-days: 1
          if-no-files-found: error

      - name: Commit Arabic changes immediately
        shell: bash
        run: |
          set -euo pipefail
          rm -f source_jom.json previous_IPA-AR.json

          if git diff --quiet -- IPA-AR.json; then
            echo '✅ No Arabic changes — nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add IPA-AR.json
          git commit -m 'Auto sync IPA-AR source'
          git pull --rebase origin main
          git push

  sync-en:
    if: github.event_name != 'push'
    needs: sync-ar
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout latest freeapps
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download previous Arabic source
        uses: actions/download-artifact@v4
        with:
          name: previous-ipa-ar
          path: .

      - name: Translate only changed descriptions to English
        env:
          PYTHONUNBUFFERED: '1'
          TRANSLATE_WORKERS: '6'
          TRANSLATE_MAX_RPM: '45'
          TRANSLATION_CHUNK_CHARS: '800'
        run: |
          set -euo pipefail
          python -u sync_apps.py             --translate-only             --target IPA-AR.json             --target-en IPA-EN.json             --old-target previous_IPA-AR.json

      - name: Validate English source
        run: |
          python - <<'PY'
          import json

          with open('IPA-AR.json', 'r', encoding='utf-8') as f:
              ar = json.load(f)
          with open('IPA-EN.json', 'r', encoding='utf-8') as f:
              en = json.load(f)

          ar_apps = [a for a in ar.get('apps', []) if isinstance(a, dict)]
          en_apps = [a for a in en.get('apps', []) if isinstance(a, dict)]

          if len(ar_apps) != len(en_apps):
              raise SystemExit(f'❌ AR/EN app counts differ: {len(ar_apps)} != {len(en_apps)}')

          empty_en = sum(1 for a in en_apps if not str(a.get('localizedDescription') or '').strip())
          print(f'✅ AR apps: {len(ar_apps)}')
          print(f'✅ EN apps: {len(en_apps)}')
          print(f'ℹ️ EN descriptions currently empty: {empty_en}')
          print(f"✅ translation format: {en.get('translationFormatVersion')}")
          PY

      - name: Commit English changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f previous_IPA-AR.json

          if git diff --quiet -- IPA-EN.json; then
            echo '✅ No English changes — nothing to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add IPA-EN.json
          git commit -m 'Auto sync IPA-EN source'
          git pull --rebase origin main
          git push
