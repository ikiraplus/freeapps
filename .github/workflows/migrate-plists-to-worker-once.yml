name: Migrate plist downloads to Worker once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-plists-to-worker-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Patch update-plists workflow to publish Worker URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/update-plists.yml')
          text = p.read_text(encoding='utf-8')

          old_import = '          import urllib.request\n'
          new_import = '          import urllib.request\n          import urllib.parse\n'
          if '          import urllib.parse\n' not in text:
              if old_import not in text:
                  raise SystemExit('urllib.request import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_url = '                  new_url = asset["browser_download_url"]\n'
          new_url = (
              '                  asset_id = int(asset.get("id") or 0)\n'
              '                  asset_name = str(asset.get("name") or "").strip()\n'
              '                  if asset_id <= 0 or not asset_name:\n'
              '                      rejected.append(f"{plist_file}: selected release asset has no id/name")\n'
              '                      print(f"REJECTED {plist_file}: selected release asset has no id/name")\n'
              '                      continue\n'
              '                  new_url = (\n'
              '                      f"https://dl.ikiraplus.workers.dev/freeapps/{asset_id}/"\n'
              '                      f"{urllib.parse.quote(asset_name, safe=\'\')}"\n'
              '                  )\n'
          )
          if old_url in text:
              text = text.replace(old_url, new_url, 1)
          elif 'https://dl.ikiraplus.workers.dev/freeapps/{asset_id}/' not in text:
              raise SystemExit('new_url anchor not found and Worker migration not already present')

          text = text.replace(
              '# فحص سريع: الرابط الحالي ما زال Asset حقيقياً داخل نفس الريبو\n'
              '                      # ولم يتغير الملف أو الباندل، لذلك لا يعاد تنزيل IPA.',
              '# فحص سريع: الـAsset المختار ما زال نفسه ورابط الـWorker الحالي مطابق له\n'
              '                      # ولم يتغير الملف أو الباندل، لذلك لا يعاد تنزيل IPA.'
          )

          p.write_text(text, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          t = Path('.github/workflows/update-plists.yml').read_text(encoding='utf-8')
          required = [
              'import urllib.parse',
              'https://dl.ikiraplus.workers.dev/freeapps/{asset_id}/',
              'urllib.parse.quote(asset_name, safe=\'\')',
          ]
          missing = [x for x in required if x not in t]
          if missing:
              raise SystemExit('migration validation failed: ' + repr(missing))
          print('Worker plist migration patch validated')
          PY

      - name: Commit workflow migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/update-plists.yml
          if git diff --cached --quiet; then
            echo 'No update-plists workflow changes needed'
            exit 0
          fi
          git commit -m 'Route freeapps plist IPA downloads through Worker'
          git pull --rebase origin main
          git push origin main
