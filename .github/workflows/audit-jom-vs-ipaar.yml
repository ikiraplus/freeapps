name: Audit jom vs IPA-AR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-jom-vs-ipaar.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ikiraplus/ipastore/main/jom.json' -o /tmp/jom.json
          python3 - <<'PY'
          import json
          from collections import Counter
          import sync_apps

          jom = json.load(open('/tmp/jom.json', encoding='utf-8')).get('apps', [])
          ar = json.load(open('IPA-AR.json', encoding='utf-8')).get('apps', [])

          print('JOM_TOTAL=', len(jom))
          print('AR_TOTAL=', len(ar))

          jnames = Counter(str(a.get('name','')).strip() for a in jom if isinstance(a,dict))
          anames = Counter(str(a.get('name','')).strip() for a in ar if isinstance(a,dict))
          print('MISSING_BY_NAME=', list((jnames-anames).elements()))
          print('EXTRA_BY_NAME=', list((anames-jnames).elements()))

          start = sync_apps.find_start_index(jom)
          print('START_INDEX=', start)
          print('BEFORE_START=', [(a.get('id'), a.get('name'), a.get('hidden')) for a in jom[:start]])
          certs = [(i,a.get('id'),a.get('name'),a.get('hidden')) for i,a in enumerate(jom) if sync_apps.is_certificate_app(a)]
          print('CERTIFICATE_APPS=', certs)

          # Show exact source rows for names absent from AR.
          missing = Counter(jnames-anames)
          for i,a in enumerate(jom):
              n=str(a.get('name','')).strip()
              if missing[n] > 0:
                  print('MISSING_ROW=', i, json.dumps(a, ensure_ascii=False, sort_keys=True))
                  missing[n] -= 1

          # Reproduce expected source set per sync rules.
          expected=[]
          seen=set()
          skipped_dupes=[]
          skipped_certs=[]
          for i,a in enumerate(jom[start:], start=start):
              if sync_apps.is_certificate_app(a):
                  skipped_certs.append((i,a.get('id'),a.get('name')))
                  continue
              key=sync_apps.source_record_identity(a)
              if key and key in seen:
                  skipped_dupes.append((i,a.get('id'),a.get('name'),key))
                  continue
              if key: seen.add(key)
              expected.append(a)
          print('EXPECTED_AFTER_RULES=', len(expected))
          print('SKIPPED_CERTS_AFTER_START=', skipped_certs)
          print('SKIPPED_DUPES=', skipped_dupes)
          print('EXPECTED_MINUS_AR=', list((Counter(str(a.get('name','')).strip() for a in expected)-anames).elements()))
          PY
