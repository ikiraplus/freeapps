name: Audit jom vs IPA-AR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-jom-vs-ipaar.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/ikiraplus/ipastore/main/jom.json' -o /tmp/jom.json
          python3 - <<'PY'
          import json
          import sync_apps
          from collections import Counter

          jom_source = json.load(open('/tmp/jom.json', encoding='utf-8'))
          ar_source = json.load(open('IPA-AR.json', encoding='utf-8'))
          jom = jom_source.get('apps', [])
          ar = ar_source.get('apps', [])

          print('JOM_TOTAL=', len(jom))
          print('AR_TOTAL=', len(ar))
          start = sync_apps.find_start_index(jom)
          records, matched, report = sync_apps.prepare_source_records(jom_source, ar)
          print('START_INDEX=', start)
          print('IGNORED_BEFORE_START=', [(a.get('id'),a.get('name')) for a in report['ignored_before_start']])
          print('SKIPPED_CERTIFICATES=', report['skipped_certificates'])
          print('SKIPPED_SOURCE_DUPLICATES=', report['skipped_source_duplicates'])
          print('TARGET_MATCH_COLLISIONS=', report['target_match_collisions'])
          print('SOURCE_RECORDS_AFTER_ALL_RULES=', len(records))
          print('DUPLICATE_TARGET_KEYS=', report['duplicate_target_keys'][:30])

          # Show all source rows for collision names and their initial match indexes.
          for collision_name in report['target_match_collisions']:
              print('COLLISION_NAME=', collision_name)
              for i,a in enumerate(jom):
                  if sync_apps.normalize_arabic(a.get('name')) == sync_apps.normalize_arabic(collision_name):
                      fixed = sync_apps.normalize_app(a, set(), used_ids=set())
                      idx = sync_apps.find_matching_target_index(a, fixed, sync_apps.build_target_lookup(ar)[0])
                      target = ar[idx] if idx is not None and idx < len(ar) else None
                      print('SOURCE_COLLISION_ROW=', i, json.dumps(a, ensure_ascii=False, sort_keys=True))
                      print('MATCH_INDEX=', idx)
                      print('MATCH_TARGET=', json.dumps(target, ensure_ascii=False, sort_keys=True) if target else None)
          PY
