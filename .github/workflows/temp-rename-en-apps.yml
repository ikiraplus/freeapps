name: Temporary rename Regram and Beegram in EN source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-rename-en-apps.yml'

permissions:
  contents: write

jobs:
  rename-en:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Rename only in IPA-EN.json
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('IPA-EN.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          apps = data.get('apps', [])
          wanted = {
              'APP-9268555834': 'Regram',
              'APP-4229526127': 'Beegram',
          }
          changed = {}
          for app in apps:
              if not isinstance(app, dict):
                  continue
              app_id = str(app.get('id', '')).strip()
              if app_id in wanted:
                  changed[app_id] = (app.get('name'), wanted[app_id])
                  app['name'] = wanted[app_id]

          missing = sorted(set(wanted) - set(changed))
          if missing:
              raise SystemExit(f'Missing app ids in IPA-EN.json: {missing}')
          if len(apps) != 1000:
              raise SystemExit(f'Expected IPA-EN.json to stay at 1000 apps, got {len(apps)}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          for app_id, names in changed.items():
              print(app_id, names[0], '->', names[1])
          print('IPA-EN.json apps:', len(apps))
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPA-EN.json
          git commit -m 'Temporarily rename Regram and Beegram in EN source'
          git pull --rebase origin main
          git push origin main
